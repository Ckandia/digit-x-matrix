services:
    - type: web
      name: digit-x-matrix-backend
      runtime: node
      rootDir: backend
      buildCommand: npm install
      startCommand: npm start
      envVars:
          - key: DERIV_APP_ID
            sync: false
          - key: ALLOWED_ORIGIN
            sync: false
          - key: DATABASE_URL
            sync: false
          # Claude connector. Render generates a random value for each; copy them from the service's Environment tab.
          - key: MCP_SECRET
            generateValue: true
          - key: JOURNAL_SYNC_KEY
            generateValue: true
          # Server-side AI runner (keeps trading when your browser is closed). Copy this value into the AI tab's "Runner key" box.
          # Delete this entry to switch the runner off completely.
          - key: RUNNER_KEY
            generateValue: true
