services:
    - type: web
      name: digit-x-matrix-backend
      runtime: node
      rootDir: backend
      buildCommand: npm install
      startCommand: npm start
      envVars:
          - key: DERIV_APP_ID
            sync: false
          - key: ALLOWED_ORIGIN
            sync: false
          - key: DATABASE_URL
            sync: false
          # Claude connector. Render generates a random value for each; copy them from the service's Environment tab.
          - key: MCP_SECRET
            generateValue: true
          - key: JOURNAL_SYNC_KEY
            generateValue: true
          # 24/7 server-side AI runs (the "Keep trading when I close this page" switch in the AI tab).
          # NOTE: a run only survives while this service stays awake. Render's free plan sleeps a service after 15 minutes
          # without a request, which ends the run, so use an always-on (paid) instance for this.
          - key: RUNNER_ENABLED
            value: 'true'
          # Encrypts the saved Deriv login so a restart can resume a run (needs DATABASE_URL). Without it a restart stops runs.
          - key: RUNNER_ENC_KEY
            generateValue: true
